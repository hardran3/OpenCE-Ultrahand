[*Settings]

[Engine: OpenCE]
;visibility_condition=path_exists /switch/.packages/halo/overlay/game/OpenCE.flag
;hold=true
notify "Engine Active" "Running OpenCE Engine"

[Engine: ChupaThingyCE]
;visibility_condition=path_exists /switch/.packages/halo/overlay/game/ChupaThingyCE.flag
;hold=true
notify "Engine Active" "Running ChupaThingyCE Engine"

[Advanced Mode]
;mode=toggle
;flag=/switch/.packages/halo/overlay/state/advanced_mode.flag
;toggle_state_condition=path_exists /switch/.packages/halo/overlay/state/advanced_mode.flag
on:
    touch /switch/.packages/halo/overlay/state/advanced_mode.flag
    notify "Halo UI" "Advanced Mode Enabled"
off:
    delete /switch/.packages/halo/overlay/state/advanced_mode.flag
    notify "Halo UI" "Advanced Mode Disabled"

[Update Halo Overlay]
;hold=true
notify "Halo Updater" "Downloading latest release..."
download "https://github.com/hardran3/OpenCE-Ultrahand/releases/latest/download/OpenCE-Ultrahand.zip" /switch/.packages/halo/update.zip
notify "Halo Updater" "Extracting update files..."
unzip /switch/.packages/halo/update.zip /
delete /switch/.packages/halo/update.zip
notify "Halo Updater" "Updated! Reloading overlay..."
exit
