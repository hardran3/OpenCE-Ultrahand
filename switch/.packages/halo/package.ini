[*Updates]

[Update Halo Overlay]
;hold=true
notify "Halo Updater" "Downloading latest release..."
download "https://github.com/hardran3/OpenCE-Ultrahand/releases/latest/download/OpenCE-Ultrahand.zip" /switch/.packages/halo/update.zip
notify "Halo Updater" "Extracting update files..."
unzip /switch/.packages/halo/update.zip /
delete /switch/.packages/halo/update.zip
notify "Halo Updater" "Updated! Reloading overlay..."
exit
