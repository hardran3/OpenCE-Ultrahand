;title=Halo Settings
;version=1.1.1
;creator=Ryan
;color=#38FFB3

[*Cheats]

[God Mode]
;mode=toggle
;flag=/switch/.packages/halo/overlay/flags/cheat_deathless_player.flag
;toggle_state_condition=path_exists /switch/.packages/halo/overlay/flags/cheat_deathless_player.flag
on:
    try: !path_exists /switch/.packages/halo/overlay/command.txt
    copy '/switch/.packages/halo/commands/god_on.txt' /switch/.packages/halo/overlay/command.tmp
    rename /switch/.packages/halo/overlay/command.tmp /switch/.packages/halo/overlay/command.txt
    try: !path_exists /switch/.packages/halo/overlay/state/notifications_disabled.flag
    notify "Halo Cheats" "Sent: God Mode On"
    catch:
    catch: notify "Halo Busy" "Previous command pending..."
off:
    try: !path_exists /switch/.packages/halo/overlay/command.txt
    copy '/switch/.packages/halo/commands/god_off.txt' /switch/.packages/halo/overlay/command.tmp
    rename /switch/.packages/halo/overlay/command.tmp /switch/.packages/halo/overlay/command.txt
    try: !path_exists /switch/.packages/halo/overlay/state/notifications_disabled.flag
    notify "Halo Cheats" "Sent: God Mode Off"
    catch:
    catch: notify "Halo Busy" "Previous command pending..."

