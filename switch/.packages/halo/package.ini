;title=Halo Settings
;version=1.0.2
;creator=Ryan
;color=#38FFB3

[*Cheats]

[Enable God Mode (Deathless)]
try: !path_exists /switch/halo/overlay/command.txt
copy '/switch/.packages/halo/commands/god_on.txt' /switch/halo/overlay/command.tmp
rename /switch/halo/overlay/command.tmp /switch/halo/overlay/command.txt
notify "Halo Cheats" "Sent: God Mode On"
catch: notify "Halo Busy" "Previous command pending..."

[Disable God Mode (Deathless)]
try: !path_exists /switch/halo/overlay/command.txt
copy '/switch/.packages/halo/commands/god_off.txt' /switch/halo/overlay/command.tmp
rename /switch/halo/overlay/command.tmp /switch/halo/overlay/command.txt
notify "Halo Cheats" "Sent: God Mode Off"
